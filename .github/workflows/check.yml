name: Check examples
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run eval:streaming
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gallery-evaluation
          path: test-results/
